name: One-time repository docs formatting
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/docs-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format curated documentation
        run: npx prettier --write README.md CONTRIBUTING.md CHANGELOG.md .github/ISSUE_TEMPLATE/bug_report.md .github/ISSUE_TEMPLATE/feature_request.md .github/PULL_REQUEST_TEMPLATE.md .github/workflows/ci.yml
      - name: Commit formatted documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CONTRIBUTING.md CHANGELOG.md .github/ISSUE_TEMPLATE/bug_report.md .github/ISSUE_TEMPLATE/feature_request.md .github/PULL_REQUEST_TEMPLATE.md .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo 'Documentation already formatted'
          else
            git commit -m 'style(docs): format professional repository documentation'
            git push origin HEAD:main
          fi
